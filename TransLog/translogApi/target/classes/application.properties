# Conexion a PostgreSQL. Es lo unico que hay que cambiar para correr el
# proyecto en otra maquina: el puerto, el usuario y la contrasena.
# El puerto habitual de PostgreSQL es 5432.
spring.datasource.url=jdbc:postgresql://localhost:5433/TransLog
spring.datasource.username=postgres
spring.datasource.password=Uisrael.

server.port=8090

# El esquema lo crea el script translog.sql: la aplicacion no lo modifica.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
