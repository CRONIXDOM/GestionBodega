<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="UTF-8">
<title>Envío</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-box-seam" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Operación</p>
					<h1 class="h3 mb-1">Registro de Envío</h1>
					<p class="text-muted mb-0">Ciudad de origen, ciudad de destino, peso, fecha y valor declarado.</p>
				</div>
			</div>
		</div>

		<section class="row g-3 mt-1">
			<div class="col-12 col-xl-7">
				<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
				<form class="panel" th:action="@{/envio/guardar}" th:object="${envio}" method="post">
					<input type="hidden" th:field="*{idEnvio}">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Ciudad de origen <span class="text-danger">*</span></label>
							<select class="form-select" th:field="*{idCiudadOrigen}" required>
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesCiudad}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Ciudad de destino <span class="text-danger">*</span></label>
							<select class="form-select" th:field="*{idCiudadDestino}" required>
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesCiudad}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Peso (kg) <span class="text-danger">*</span></label>
							<input class="form-control" type="number" th:field="*{peso}" required min="0.01" step="0.01">
						</div>
						<div class="col-md-6">
							<label class="form-label">Fecha de registro <span class="text-danger">*</span></label>
							<input class="form-control" type="date" id="fechaRegistro" name="fechaRegistro"
								th:value="${envio.fechaRegistro}" required>
						</div>
						<div class="col-md-6">
							<label class="form-label">Valor declarado <span class="text-danger">*</span></label>
							<input class="form-control" type="number" th:field="*{valorDeclarado}" required min="0" step="0.01">
						</div>
						<div class="col-md-6">
							<label class="form-label">Estado <span class="text-danger">*</span></label>
							<select class="form-select" th:field="*{estado}" required>
								<option value="">Seleccione...</option>
								<option th:value="'REGISTRADO'" th:text="'REGISTRADO'"></option>
								<option th:value="'EN_TRANSITO'" th:text="'EN_TRANSITO'"></option>
								<option th:value="'ENTREGADO'" th:text="'ENTREGADO'"></option>
								<option th:value="'CON_NOVEDAD'" th:text="'CON_NOVEDAD'"></option>
							</select>
						</div>
					</div>

					<div class="alert alert-info mt-3 mb-0" role="alert">
						<i class="bi bi-info-circle" aria-hidden="true"></i> El envío se asigna a un despacho desde la
						pantalla de despachos, que es donde se puede comprobar que la ruta, el vehículo y el conductor
						cumplen la regla.
					</div>
					<div class="d-flex justify-content-end gap-2 mt-4">
						<a class="btn btn-light" th:href="@{/envio}">
							<i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
						</a>
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check2-circle" aria-hidden="true"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</section>
	</div>
</body>
</html>
