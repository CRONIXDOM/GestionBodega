<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="UTF-8">
<title>Ruta</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-signpost-split" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Operación</p>
					<h1 class="h3 mb-1">Registro de Ruta</h1>
					<p class="text-muted mb-0">De qué ciudad a qué ciudad, y cuánto hay entre ellas.</p>
				</div>
			</div>
		</div>

		<section class="row g-3 mt-1">
			<div class="col-12 col-xl-7">
				<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
				<form class="panel" th:action="@{/ruta/guardar}" th:object="${ruta}" method="post">
					<input type="hidden" th:field="*{idRuta}">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Ciudad de origen <span class="text-danger">*</span></label>
							<select class="form-select" th:field="*{idCiudadOrigen}" required>
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesCiudad}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Ciudad de destino <span class="text-danger">*</span></label>
							<select class="form-select" th:field="*{idCiudadDestino}" required>
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesCiudad}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Distancia aproximada (km) <span class="text-danger">*</span></label>
							<input class="form-control" type="number" th:field="*{distanciaKm}" required min="0.01" step="0.01">
						</div>
					</div>
					<div class="d-flex justify-content-end gap-2 mt-4">
						<a class="btn btn-light" th:href="@{/ruta}">
							<i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
						</a>
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check2-circle" aria-hidden="true"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</section>
	</div>
</body>
</html>
