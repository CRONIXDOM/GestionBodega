<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="UTF-8">
<title>Envíos</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-box-seam" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Operación</p>
					<h1 class="h3 mb-1">Envíos</h1>
					<p class="text-muted mb-0">Los paquetes registrados. Se asignan a un despacho desde la pantalla de despachos.</p>
				</div>
			</div>
			<div class="heading-actions">
				<a class="btn btn-primary btn-sm" th:href="@{/envio/nuevo}"><i class="bi bi-plus-circle"
					aria-hidden="true"></i> Nuevo</a>
			</div>
		</div>

		<div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
			<i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i> <span th:text="${error}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
		</div>

		<section class="panel mt-3">
			<div class="p-3 pb-0">
				<div class="input-group table-search" style="max-width: 340px;">
					<span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
					<input type="text" class="form-control" data-table-search="tablaEnvio" placeholder="Buscar...">
				</div>
			</div>
			<div class="table-responsive">
				<table id="tablaEnvio" class="table align-middle mb-0" data-page-size="15">
					<thead>
						<tr>
							<th scope="col">Id</th>
							<th scope="col">Origen</th>
							<th scope="col">Destino</th>
							<th scope="col">Peso</th>
							<th scope="col">Registro</th>
							<th scope="col">Valor declarado</th>
							<th scope="col">Estado</th>
							<th scope="col">Despacho</th>
							<th scope="col" class="text-end">Acción</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="indice:${listaenvio}">
							<td class="fw-semibold" th:text="${indice.idEnvio}"></td>
							<td th:text="${ciudades.get(indice.idCiudadOrigen)} ?: ('#' + ${indice.idCiudadOrigen})"></td>
							<td th:text="${ciudades.get(indice.idCiudadDestino)} ?: ('#' + ${indice.idCiudadDestino})"></td>
							<td><span class="fw-semibold" th:text="${indice.peso}"></span> <span class="text-muted small">kg</span></td>
							<td th:text="${indice.fechaRegistro}"></td>
							<td th:text="${indice.valorDeclarado}"></td>
							<td><span class="badge bg-secondary-subtle text-body" th:text="${indice.estado}"></span></td>
							<td>
								<span th:if="${indice.idDespacho != null}" class="badge text-bg-primary"
									th:text="'Despacho ' + ${indice.idDespacho}"></span>
								<span th:if="${indice.idDespacho == null}" class="badge text-bg-success">Libre</span>
							</td>
							<td class="text-end">
								<a class="btn btn-light btn-sm" th:href="@{/envio/editar/{id}(id=${indice.idEnvio})}"><i
									class="bi bi-pencil" aria-hidden="true"></i> Editar</a>
								<a class="btn btn-outline-danger btn-sm" th:href="@{/envio/eliminar/{id}(id=${indice.idEnvio})}"
									onclick="return confirm('¿Seguro que deseas eliminar?')"><i class="bi bi-trash"
									aria-hidden="true"></i> Eliminar</a>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(listaenvio)}">
							<td colspan="9" class="text-center text-muted py-4">Todavía no hay envíos registrados.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</body>
</html>
