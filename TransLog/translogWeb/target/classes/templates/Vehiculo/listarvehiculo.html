<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="UTF-8">
<title>Vehículos</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-truck" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Flota</p>
					<h1 class="h3 mb-1">Vehículos</h1>
					<p class="text-muted mb-0">La flota, con su capacidad de carga y su estado.</p>
				</div>
			</div>
			<div class="heading-actions">
				<a class="btn btn-primary btn-sm" th:href="@{/vehiculo/nuevo}"><i class="bi bi-plus-circle"
					aria-hidden="true"></i> Nuevo</a>
			</div>
		</div>

		<div th:if="${exito}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
			<i class="bi bi-check2-circle" aria-hidden="true"></i> <span th:text="${exito}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
		</div>
		<div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
			<i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i> <span th:text="${error}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
		</div>

		<section class="panel mt-3">
			<div class="p-3 pb-0">
				<div class="input-group table-search" style="max-width: 340px;">
					<span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
					<input type="text" class="form-control" data-table-search="tablaVehiculo" placeholder="Buscar...">
				</div>
			</div>
			<div class="table-responsive">
				<table id="tablaVehiculo" class="table align-middle mb-0" data-page-size="15">
					<thead>
						<tr>
							<th scope="col">Id</th>
							<th scope="col">Placa</th>
							<th scope="col">Capacidad</th>
							<th scope="col">Estado</th>
							<th scope="col" class="text-end">Acción</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="indice:${listavehiculo}">
							<td class="fw-semibold" th:text="${indice.idVehiculo}"></td>
							<td><span class="badge bg-secondary-subtle text-body font-monospace" th:text="${indice.placa}"></span></td>
							<td><span class="fw-semibold" th:text="${indice.capacidadMaxima}"></span> <span class="text-muted small">kg</span></td>
							<td><span class="badge"
								th:classappend="${indice.estado == 'DISPONIBLE'} ? 'text-bg-success' : 'text-bg-secondary'"
								th:text="${indice.estado}"></span></td>
							<td class="text-end">
								<a class="btn btn-light btn-sm" th:href="@{/vehiculo/editar/{id}(id=${indice.idVehiculo})}"><i
									class="bi bi-pencil" aria-hidden="true"></i> Editar</a>
								<a class="btn btn-outline-danger btn-sm" th:href="@{/vehiculo/eliminar/{id}(id=${indice.idVehiculo})}"
									onclick="return confirm('¿Seguro que deseas eliminar?')"><i class="bi bi-trash"
									aria-hidden="true"></i> Eliminar</a>
							</td>
						</tr>
						<tr data-empty-row th:if="${#lists.isEmpty(listavehiculo)}">
							<td colspan="5" class="text-center text-muted py-4">Todavía no hay registros.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</body>
</html>
