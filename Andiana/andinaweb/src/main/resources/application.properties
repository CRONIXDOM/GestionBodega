spring.application.name=andinaweb
server.port=${WEB_PUERTO:8091}

spring.thymeleaf.cache=false

# ============================================================================
#  Direccion donde escucha andianaApi. Si la API se levanta en otro puerto o
#  en otra maquina, se cambia aqui (o con la variable de entorno API_URL) sin
#  tocar el codigo.
# ============================================================================
andiana.api.url=${API_URL:http://localhost:8090}

# Que la pagina de error propia se encargue de todo, incluidas las rutas que
# no existen, en vez de la pantalla blanca de Spring.
spring.web.resources.add-mappings=true
server.error.whitelabel.enabled=false
