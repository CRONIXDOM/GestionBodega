<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="UTF-8">
<title>Órdenes de Producción</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-clipboard-check" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Producción</p>
					<h1 class="h3 mb-1">Registro de Órdenes de Producción</h1>
					<p class="text-muted mb-0">Completa los datos del formulario.</p>
				</div>
			</div>
		</div>

		<section class="row g-3 mt-1">
			<div class="col-12 col-xl-8">
				<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

				<form class="panel" th:action="@{/orden/guardar}" th:object="${orden}" method="post">
					<input type="hidden" th:field="*{idOrden}">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Producto <span class="text-danger">*</span></label>
							<select class="form-select" th:field="*{idProducto}" required>
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesProducto}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Fecha programada <span class="text-danger">*</span></label>
							<input class="form-control" type="date" id="fechaProgramada" name="fechaProgramada"
								th:value="${orden.fechaProgramada}" required>
						</div>
						<div class="col-md-6">
							<label class="form-label">Cantidad programada <span class="text-danger">*</span></label>
							<input class="form-control" type="number" th:field="*{cantidadProgramada}" required min="0.01" step="0.01">
						</div>
						<div class="col-md-6">
							<label class="form-label">Estado <span class="text-danger">*</span></label>
							<select class="form-select" th:field="*{estado}" required>
								<option value="">Seleccione...</option>
								<option th:value="'PLANIFICADA'" th:text="'PLANIFICADA'"></option>
								<option th:value="'EN_PROCESO'" th:text="'EN_PROCESO'"></option>
								<option th:value="'FINALIZADA'" th:text="'FINALIZADA'"></option>
								<option th:value="'CANCELADA'" th:text="'CANCELADA'"></option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Responsable</label>
							<input class="form-control" type="text" th:field="*{responsable}" >
						</div>
					</div>

					<div class="d-flex justify-content-end gap-2 mt-4">
						<a class="btn btn-light" th:href="@{/orden}">
							<i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
						</a>
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check2-circle" aria-hidden="true"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</section>
	</div>
</body>
</html>
