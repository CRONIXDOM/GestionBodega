<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="utf-8">
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-clipboard-check" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Producción</p>
					<h1 class="h3 mb-1">Órdenes de Producción</h1>
					<p class="text-muted mb-0">Lo que planificación manda a fabricar.</p>
				</div>
			</div>
			<div class="heading-actions">
				<a class="btn btn-primary btn-sm" th:href="@{/orden/nuevo}"><i class="bi bi-plus-circle"
					aria-hidden="true"></i> Nuevo</a>
			</div>
		</div>

		<div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
			<i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i> <span th:text="${error}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
		</div>

		<section class="panel mt-3">
			<div class="p-3 pb-0">
				<div class="input-group table-search" style="max-width: 340px;">
					<span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
					<input type="text" class="form-control" data-table-search="tablaOrden" placeholder="Buscar...">
				</div>
			</div>
			<div class="table-responsive">
				<table id="tablaOrden" class="table align-middle mb-0" data-page-size="15">
					<thead>
						<tr>
							<th scope="col">Id</th>
							<th scope="col">Producto</th>
							<th scope="col">Fecha programada</th>
							<th scope="col">Cantidad</th>
							<th scope="col">Estado</th>
							<th scope="col">Responsable</th>
							<th scope="col" class="text-end">Acción</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="indice:${listaorden}">
							<td class="fw-semibold" th:text="${indice.idOrden}"></td>
							<td th:with="op=${opcionesProducto.?[id == __${indice.idProducto}__]}"
								th:text="${#lists.isEmpty(op)} ? '—' : ${op[0].etiqueta}">—</td>
							<td th:text="${indice.fechaProgramada} ?: '—'"></td>
							<td th:text="${indice.cantidadProgramada} ?: '—'"></td>
							<td><span class="badge bg-secondary-subtle text-body" th:text="${indice.estado} ?: '—'">—</span></td>
							<td th:text="${indice.responsable} ?: '—'"></td>
							<td class="text-end">
								<a class="btn btn-light btn-sm" th:href="@{/orden/editar/{id}(id=${indice.idOrden})}"><i
									class="bi bi-pencil" aria-hidden="true"></i> Editar</a>
								<a class="btn btn-outline-danger btn-sm" th:href="@{/orden/eliminar/{id}(id=${indice.idOrden})}"
									onclick="return confirm('¿Seguro que deseas eliminar?')"><i class="bi bi-trash"
									aria-hidden="true"></i> Eliminar</a>
							</td>
						</tr>
						<tr data-empty-row th:if="${#lists.isEmpty(listaorden)}">
							<td colspan="7" class="text-center text-muted py-4">Todavía no hay órdenes registradas.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</body>
</html>
