<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{plantilla}" lang="es">
<head>
<meta charset="utf-8">
</head>
<body>
	<div layout:fragment="contenido">

		<!-- Igual que la lista: un solo formulario para las nueve secciones. El
		     tipo de cada campo decide que control se dibuja. -->
		<div class="titulo">
			<h1 th:text="${fila.get(seccion.clavePrimaria()) != null}
				? 'Editar ' + ${seccion.singular()} : 'Nuevo ' + ${seccion.singular()}">Formulario</h1>
		</div>

		<form class="panel" method="post" th:action="@{'/' + ${seccion.clave()} + '/guardar'}">

			<input type="hidden" th:name="${seccion.clavePrimaria()}"
				th:value="${fila.get(seccion.clavePrimaria())}">

			<div class="campos">
				<div class="campo" th:each="campo : ${seccion.camposEditables()}"
					th:with="valor=${fila.get(campo.nombre())}">

					<label th:for="${campo.nombre()}">
						<span th:text="${campo.etiqueta()}">Etiqueta</span>
						<span class="obligatorio" th:if="${campo.obligatorio()}">*</span>
					</label>

					<!-- texto -->
					<input th:if="${campo.tipo().name() == 'TEXTO'}" type="text"
						th:id="${campo.nombre()}" th:name="${campo.nombre()}" th:value="${valor}"
						th:required="${campo.obligatorio()}">

					<!-- numero entero -->
					<input th:if="${campo.tipo().name() == 'NUMERO'}" type="number" min="1" step="1"
						th:id="${campo.nombre()}" th:name="${campo.nombre()}" th:value="${valor}"
						th:required="${campo.obligatorio()}">

					<!-- numero con decimales -->
					<input th:if="${campo.tipo().name() == 'DECIMAL'}" type="number" step="0.001" min="0"
						th:id="${campo.nombre()}" th:name="${campo.nombre()}" th:value="${valor}"
						th:required="${campo.obligatorio()}">

					<!-- fecha -->
					<input th:if="${campo.tipo().name() == 'FECHA'}" type="date"
						th:id="${campo.nombre()}" th:name="${campo.nombre()}" th:value="${valor}"
						th:required="${campo.obligatorio()}">

					<!-- lista cerrada de valores -->
					<select th:if="${campo.tipo().name() == 'LISTA'}"
						th:id="${campo.nombre()}" th:name="${campo.nombre()}" th:required="${campo.obligatorio()}">
						<option value="">Seleccione...</option>
						<option th:each="o : ${campo.opciones()}" th:value="${o}" th:text="${o}"
							th:selected="${o == valor}"></option>
					</select>

					<!-- referencia a otra seccion -->
					<select th:if="${campo.tipo().name() == 'RELACION'}"
						th:id="${campo.nombre()}" th:name="${campo.nombre()}" th:required="${campo.obligatorio()}">
						<option value="">Seleccione...</option>
						<option th:each="o : ${opciones.get(campo.seccionRelacionada())}"
							th:value="${o.get('id')}" th:text="${o.get('texto')}"
							th:selected="${#strings.toString(o.get('id')) == #strings.toString(valor)}"></option>
					</select>

					<!-- si / no -->
					<label class="interruptor" th:if="${campo.tipo().name() == 'SI_NO'}">
						<input type="checkbox" th:id="${campo.nombre()}" th:name="${campo.nombre()}"
							value="true" th:checked="${valor}">
						<span>Si</span>
					</label>

				</div>
			</div>

			<div class="botonera">
				<a class="boton" th:href="@{'/' + ${seccion.clave()}}">Volver</a>
				<button class="boton principal" type="submit">Guardar</button>
			</div>

		</form>

	</div>
</body>
</html>
