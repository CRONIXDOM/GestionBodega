<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="utf-8">
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-journal-text" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Fórmulas</p>
					<h1 class="h3 mb-1">Recetas</h1>
					<p class="text-muted mb-0">Fórmula de cada producto. Un producto puede tener varias versiones.</p>
				</div>
			</div>
			<div class="heading-actions">
				<a class="btn btn-primary btn-sm" th:href="@{/receta/nuevo}"><i class="bi bi-plus-circle"
					aria-hidden="true"></i> Nuevo</a>
			</div>
		</div>

		<div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
			<i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i> <span th:text="${error}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
		</div>

		<section class="panel mt-3">
			<div class="p-3 pb-0">
				<div class="input-group table-search" style="max-width: 340px;">
					<span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
					<input type="text" class="form-control" data-table-search="tablaReceta" placeholder="Buscar...">
				</div>
			</div>
			<div class="table-responsive">
				<table id="tablaReceta" class="table align-middle mb-0" data-page-size="15">
					<thead>
						<tr>
							<th scope="col">Id</th>
							<th scope="col">Producto</th>
							<th scope="col">Versión</th>
							<th scope="col">Vigencia</th>
							<th scope="col">Vigente</th>
							<th scope="col" class="text-end">Acción</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="indice:${listareceta}">
							<td class="fw-semibold" th:text="${indice.idReceta}"></td>
							<td th:with="op=${opcionesProducto.?[id == __${indice.idProducto}__]}"
								th:text="${#lists.isEmpty(op)} ? '—' : ${op[0].etiqueta}">—</td>
							<td><span class="badge bg-secondary-subtle text-body" th:text="${indice.version} ?: '—'">—</span></td>
							<td th:text="${indice.fechaVigencia} ?: '—'"></td>
							<td><span class="badge" th:classappend="${indice.estado} ? 'bg-success-subtle text-success' : 'bg-secondary-subtle text-body'" th:text="${indice.estado} ? 'Sí' : 'No'">Sí</span></td>
							<td class="text-end">
								<a class="btn btn-light btn-sm" th:href="@{/receta/editar/{id}(id=${indice.idReceta})}"><i
									class="bi bi-pencil" aria-hidden="true"></i> Editar</a>
								<a class="btn btn-outline-danger btn-sm" th:href="@{/receta/eliminar/{id}(id=${indice.idReceta})}"
									onclick="return confirm('¿Seguro que deseas eliminar?')"><i class="bi bi-trash"
									aria-hidden="true"></i> Eliminar</a>
							</td>
						</tr>
						<tr data-empty-row th:if="${#lists.isEmpty(listareceta)}">
							<td colspan="6" class="text-center text-muted py-4">Todavía no hay recetas registradas.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</body>
</html>
