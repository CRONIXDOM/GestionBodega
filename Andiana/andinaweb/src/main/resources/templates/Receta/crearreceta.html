<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="UTF-8">
<title>Recetas</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-journal-text" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Fórmulas</p>
					<h1 class="h3 mb-1">Registro de Recetas</h1>
					<p class="text-muted mb-0">Completa los datos del formulario.</p>
				</div>
			</div>
		</div>

		<section class="row g-3 mt-1">
			<div class="col-12 col-xl-8">
				<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

				<form class="panel" th:action="@{/receta/guardar}" th:object="${receta}" method="post">
					<input type="hidden" th:field="*{idReceta}">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Producto <span class="text-danger">*</span></label>
							<select class="form-select" th:field="*{idProducto}" required>
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesProducto}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Versión <span class="text-danger">*</span></label>
							<input class="form-control" type="number" th:field="*{version}" required min="1" step="1">
						</div>
						<div class="col-md-6">
							<label class="form-label">Fecha de vigencia <span class="text-danger">*</span></label>
							<input class="form-control" type="date" id="fechaVigencia" name="fechaVigencia"
								th:value="${receta.fechaVigencia}" required>
						</div>
						<div class="col-md-6">
							<label class="form-label">Vigente</label>
							<div class="form-check form-switch mt-2">
								<input class="form-check-input" type="checkbox" th:field="*{estado}">
								<label class="form-check-label">Sí</label>
							</div>
						</div>
					</div>

					<div class="d-flex justify-content-end gap-2 mt-4">
						<a class="btn btn-light" th:href="@{/receta}">
							<i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
						</a>
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check2-circle" aria-hidden="true"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</section>
	</div>
</body>
</html>
