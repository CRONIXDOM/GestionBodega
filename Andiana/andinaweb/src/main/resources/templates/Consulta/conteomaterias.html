<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="utf-8">
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-bar-chart" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Consultas</p>
					<h1 class="h3 mb-1">Número de materias primas por receta</h1>
					<p class="text-muted mb-0">Cuántos insumos lleva cada fórmula, vigente o histórica.</p>
				</div>
			</div>
		</div>

		<section class="panel mt-3">
			<div class="table-responsive">
				<table id="tablaConteo" class="table align-middle mb-0" data-page-size="15">
					<thead>
						<tr>
							<th scope="col">Producto</th>
							<th scope="col">Versión</th>
							<th scope="col">Estado</th>
							<th scope="col">Materias primas</th>
							<th scope="col" class="text-end">Detalle</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="indice:${listaconteo}">
							<td class="fw-semibold" th:text="${indice.producto}"></td>
							<td th:text="${indice.version}"></td>
							<td>
								<span class="badge"
									th:classappend="${indice.activa} ? 'bg-success-subtle text-success' : 'bg-secondary-subtle text-body'"
									th:text="${indice.activa} ? 'Vigente' : 'Histórica'">Vigente</span>
							</td>
							<td><span class="badge bg-primary-subtle text-primary"
								th:text="${indice.totalMateriasPrimas}">0</span></td>
							<td class="text-end">
								<a class="btn btn-light btn-sm"
									th:href="@{/consulta/materias-receta(idReceta=${indice.idReceta})}"><i
									class="bi bi-eye" aria-hidden="true"></i> Ver cuáles</a>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(listaconteo)}">
							<td colspan="5" class="text-center text-muted py-4">Todavía no hay recetas registradas.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</body>
</html>
