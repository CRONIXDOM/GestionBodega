<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{plantilla}" lang="es">
<head>
<meta charset="utf-8">
</head>
<body>
	<div layout:fragment="contenido">

		<!-- Esta plantilla sirve para las nueve pantallas: las columnas salen de
		     los campos que declara la seccion en el catalogo. -->
		<div class="titulo">
			<h1 th:text="${seccion.titulo()}">Seccion</h1>
			<a class="boton principal" th:href="@{'/' + ${seccion.clave()} + '/nuevo'}"
				th:text="'Nuevo: ' + ${seccion.singular()}">Nuevo</a>
		</div>

		<p class="vacio" th:if="${#lists.isEmpty(filas)}">Todavia no hay registros.</p>

		<div class="tabla-caja" th:unless="${#lists.isEmpty(filas)}">
			<table>
				<thead>
					<tr>
						<th th:each="campo : ${seccion.campos()}" th:text="${campo.etiqueta()}">Columna</th>
						<th class="derecha">Accion</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="fila : ${filas}">
						<td th:each="campo : ${seccion.campos()}">
							<!-- si el campo apunta a otra seccion se muestra su nombre, no el numero -->
							<span th:if="${campo.seccionRelacionada() != null}"
								th:text="${etiquetas.get(campo.seccionRelacionada()).getOrDefault(
									#strings.toString(fila.get(campo.nombre())), '-')}">Relacion</span>

							<span th:if="${campo.seccionRelacionada() == null and campo.tipo().name() == 'SI_NO'}"
								th:text="${fila.get(campo.nombre())} ? 'Si' : 'No'">Si</span>

							<span th:if="${campo.seccionRelacionada() == null and campo.tipo().name() != 'SI_NO'}"
								th:text="${fila.get(campo.nombre())} ?: '-'">Valor</span>
						</td>
						<td class="derecha acciones">
							<a class="boton" th:href="@{'/' + ${seccion.clave()} + '/editar/' + ${fila.get(seccion.clavePrimaria())}}">Editar</a>
							<a class="boton peligro" th:href="@{'/' + ${seccion.clave()} + '/eliminar/' + ${fila.get(seccion.clavePrimaria())}}"
								onclick="return confirm('¿Seguro que deseas eliminar este registro?')">Eliminar</a>
						</td>
					</tr>
				</tbody>
			</table>
		</div>

	</div>
</body>
</html>
