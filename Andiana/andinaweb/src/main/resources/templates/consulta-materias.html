<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{plantilla}" lang="es">
<head>
<meta charset="utf-8">
</head>
<body>
	<div layout:fragment="contenido">

		<div class="titulo">
			<h1>Materias primas utilizadas en una receta</h1>
		</div>

		<form class="panel filtro" method="get" th:action="@{/consulta/materias-de-receta}">
			<div class="campo">
				<label for="idReceta">Receta</label>
				<select id="idReceta" name="idReceta" required>
					<option value="">Seleccione una receta...</option>
					<option th:each="r : ${recetas}" th:value="${r.get('id')}" th:text="${r.get('texto')}"
						th:selected="${#strings.toString(r.get('id')) == #strings.toString(idReceta)}"></option>
				</select>
			</div>
			<button class="boton principal" type="submit">Consultar</button>
		</form>

		<p class="vacio" th:if="${idReceta == null}">Elige una receta para ver que lleva.</p>

		<div th:if="${idReceta != null and materias != null}">
			<p class="resumen">
				Esta receta utiliza <strong th:text="${#lists.size(materias)}">0</strong> materias primas.
			</p>

			<p class="vacio" th:if="${#lists.isEmpty(materias)}">
				Esta receta todavia no tiene materias primas cargadas.
			</p>

			<div class="tabla-caja" th:unless="${#lists.isEmpty(materias)}">
				<table>
					<thead>
						<tr>
							<th>Materia prima</th>
							<th>Cantidad</th>
							<th>Unidad</th>
							<th>Stock actual</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="m : ${materias}">
							<td th:text="${m.get('materiaPrima')}">Materia</td>
							<td th:text="${m.get('cantidad')}">0</td>
							<td th:text="${m.get('unidad')}">Unidad</td>
							<td th:text="${m.get('stockActual')} ?: '-'">0</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

	</div>
</body>
</html>
