<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="utf-8">
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-speedometer2" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Inicio</p>
					<h1 class="h3 mb-1">Panel de Producción</h1>
					<p class="text-muted mb-0">Resumen del proceso de producción de bebidas.</p>
				</div>
			</div>
		</div>

		<section class="row g-3 mt-1">
			<div class="col-6 col-lg-3">
				<div class="panel p-3 h-100">
					<div class="text-uppercase text-muted small">Productos</div>
					<div class="h3 mb-0" th:text="${productos}">0</div>
				</div>
			</div>
			<div class="col-6 col-lg-3">
				<div class="panel p-3 h-100">
					<div class="text-uppercase text-muted small">Materias primas</div>
					<div class="h3 mb-0" th:text="${materias}">0</div>
				</div>
			</div>
			<div class="col-6 col-lg-3">
				<div class="panel p-3 h-100">
					<div class="text-uppercase text-muted small">Recetas</div>
					<div class="h3 mb-0" th:text="${recetas}">0</div>
				</div>
			</div>
			<div class="col-6 col-lg-3">
				<div class="panel p-3 h-100">
					<div class="text-uppercase text-muted small">Líneas de receta</div>
					<div class="h3 mb-0" th:text="${lineasReceta}">0</div>
				</div>
			</div>
		</section>

	</div>
</body>
</html>
