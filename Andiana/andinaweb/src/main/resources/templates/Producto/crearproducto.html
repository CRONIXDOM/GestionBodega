<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="UTF-8">
<title>Productos</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-cup-straw" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Catálogo</p>
					<h1 class="h3 mb-1">Registro de Productos</h1>
					<p class="text-muted mb-0">Completa los datos del formulario.</p>
				</div>
			</div>
		</div>

		<section class="row g-3 mt-1">
			<div class="col-12 col-xl-8">
				<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

				<form class="panel" th:action="@{/producto/guardar}" th:object="${producto}" method="post">
					<input type="hidden" th:field="*{idProducto}">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Nombre <span class="text-danger">*</span></label>
							<input class="form-control" type="text" th:field="*{nombre}" required >
						</div>
						<div class="col-md-6">
							<label class="form-label">Tipo <span class="text-danger">*</span></label>
							<input class="form-control" type="text" th:field="*{tipo}" required placeholder="Ej. GASEOSA">
						</div>
						<div class="col-md-6">
							<label class="form-label">Presentación <span class="text-danger">*</span></label>
							<input class="form-control" type="text" th:field="*{presentacion}" required placeholder="Ej. BOTELLA PET">
						</div>
						<div class="col-md-6">
							<label class="form-label">Volumen en ml <span class="text-danger">*</span></label>
							<input class="form-control" type="number" th:field="*{volumenMl}" required min="1" step="1" placeholder="Ej. 350">
						</div>
						<div class="col-md-6">
							<label class="form-label">Activo</label>
							<div class="form-check form-switch mt-2">
								<input class="form-check-input" type="checkbox" th:field="*{estado}">
								<label class="form-check-label">Sí</label>
							</div>
						</div>
					</div>

					<div class="d-flex justify-content-end gap-2 mt-4">
						<a class="btn btn-light" th:href="@{/producto}">
							<i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
						</a>
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check2-circle" aria-hidden="true"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</section>
	</div>
</body>
</html>
