<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="UTF-8">
<title>Materias Primas</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-droplet-half" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Catálogo</p>
					<h1 class="h3 mb-1">Registro de Materias Primas</h1>
					<p class="text-muted mb-0">Completa los datos del formulario.</p>
				</div>
			</div>
		</div>

		<section class="row g-3 mt-1">
			<div class="col-12 col-xl-8">
				<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

				<form class="panel" th:action="@{/materiaPrima/guardar}" th:object="${materiaPrima}" method="post">
					<input type="hidden" th:field="*{idMateria}">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Nombre <span class="text-danger">*</span></label>
							<input class="form-control" type="text" th:field="*{nombre}" required >
						</div>
						<div class="col-md-6">
							<label class="form-label">Unidad de medida <span class="text-danger">*</span></label>
							<input class="form-control" type="text" th:field="*{unidadMedida}" required placeholder="Ej. LITRO, KILOGRAMO, GRAMO">
						</div>
						<div class="col-md-6">
							<label class="form-label">Stock mínimo</label>
							<input class="form-control" type="number" th:field="*{stockMinimo}" min="0" step="0.01">
						</div>
					</div>

					<div class="alert alert-info mt-3 mb-0" role="alert">
						<i class="bi bi-info-circle" aria-hidden="true"></i> El stock actual no se escribe aquí: se calcula con los movimientos de materia prima.
					</div>
					<div class="d-flex justify-content-end gap-2 mt-4">
						<a class="btn btn-light" th:href="@{/materiaPrima}">
							<i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
						</a>
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check2-circle" aria-hidden="true"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</section>
	</div>
</body>
</html>
