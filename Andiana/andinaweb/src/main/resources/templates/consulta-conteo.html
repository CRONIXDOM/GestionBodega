<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{plantilla}" lang="es">
<head>
<meta charset="utf-8">
</head>
<body>
	<div layout:fragment="contenido">

		<div class="titulo">
			<h1>Numero de materias primas por receta</h1>
		</div>

		<p class="vacio" th:if="${#lists.isEmpty(conteo)}">Todavia no hay recetas registradas.</p>

		<div class="tabla-caja" th:unless="${#lists.isEmpty(conteo)}">
			<table>
				<thead>
					<tr>
						<th>Producto</th>
						<th>Version</th>
						<th>Estado</th>
						<th>Materias primas</th>
						<th class="derecha">Detalle</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="c : ${conteo}">
						<td th:text="${c.get('producto')}">Producto</td>
						<td th:text="${c.get('version')}">V1</td>
						<td>
							<span class="etiqueta" th:classappend="${c.get('activa')} ? 'verde' : 'gris'"
								th:text="${c.get('activa')} ? 'Activa' : 'Historica'">Activa</span>
						</td>
						<td><strong th:text="${c.get('totalMateriasPrimas')}">0</strong></td>
						<td class="derecha">
							<a class="boton"
								th:href="@{/consulta/materias-de-receta(idReceta=${c.get('idReceta')})}">Ver cuales</a>
						</td>
					</tr>
				</tbody>
			</table>
		</div>

	</div>
</body>
</html>
