<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="UTF-8">
<title>Detalle de Receta</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-list-check" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Fórmulas</p>
					<h1 class="h3 mb-1">Registro de Detalle de Receta</h1>
					<p class="text-muted mb-0">Completa los datos del formulario.</p>
				</div>
			</div>
		</div>

		<section class="row g-3 mt-1">
			<div class="col-12 col-xl-8">
				<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

				<form class="panel" th:action="@{/detallereceta/guardar}" th:object="${detalleReceta}" method="post">
					<input type="hidden" th:field="*{idDetalle}">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Receta <span class="text-danger">*</span></label>
							<select class="form-select" th:field="*{idReceta}" required>
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesReceta}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Materia prima <span class="text-danger">*</span></label>
							<select class="form-select" th:field="*{idMateria}" required>
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesMateria}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Cantidad <span class="text-danger">*</span></label>
							<input class="form-control" type="number" th:field="*{cantidad}" required min="0.001" step="0.001">
						</div>
					</div>

					<div class="alert alert-info mt-3 mb-0" role="alert">
						<i class="bi bi-info-circle" aria-hidden="true"></i> La unidad la pone la materia prima elegida, para no pedir litros de algo que se mide en gramos.
					</div>
					<div class="d-flex justify-content-end gap-2 mt-4">
						<a class="btn btn-light" th:href="@{/detallereceta}">
							<i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
						</a>
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check2-circle" aria-hidden="true"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</section>
	</div>
</body>
</html>
