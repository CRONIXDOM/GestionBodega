# ============================================================================
#  CONEXION A POSTGRESQL  --  esto es lo unico que hay que tocar para correr
#  el proyecto en otra maquina.
#
#  Cambia el puerto, el usuario y la contrasena por los de tu PostgreSQL.
#  El puerto habitual de PostgreSQL es 5432; aqui viene 5433 porque la base
#  de desarrollo esta en una segunda instancia.
#
#  Tambien se pueden pasar por variables de entorno, sin tocar el archivo:
#    DB_HOST  DB_PORT  DB_NOMBRE  DB_USUARIO  DB_CLAVE
# ============================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NOMBRE:Andiana}
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${DB_CLAVE:Uisrael.}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.application.name=andianaApi
server.port=${API_PUERTO:8090}

# La aplicacion NO modifica la base de datos: se limita a leer y escribir filas.
# "none" impide que Hibernate cree, altere o borre ninguna tabla.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Si la base no responde, que lo diga enseguida y no despues de 30 segundos.
spring.datasource.hikari.connection-timeout=5000
