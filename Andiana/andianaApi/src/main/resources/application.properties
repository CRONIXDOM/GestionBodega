# Conexion a PostgreSQL. Es lo unico que hay que cambiar para correr el
# proyecto en otra maquina: el puerto, el usuario y la contrasena.
# El puerto habitual de PostgreSQL es 5432.
spring.datasource.url=jdbc:postgresql://localhost:5433/Andiana
spring.datasource.username=postgres
spring.datasource.password=Uisrael.

server.port=8090

# La aplicacion NO modifica la base de datos: solo lee y escribe filas.
# "none" impide que Hibernate cree, altere o borre ninguna tabla.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
