spring.application.name=andianaApi
server.port=8090

# Base de datos Andiana
spring.datasource.url=jdbc:postgresql://localhost:5433/Andiana
spring.datasource.username=postgres
spring.datasource.password=Uisrael.
spring.datasource.driver-class-name=org.postgresql.Driver

# La aplicacion NO modifica la base de datos: se limita a leer y escribir filas.
# "none" impide que Hibernate cree, altere o borre ninguna tabla.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
