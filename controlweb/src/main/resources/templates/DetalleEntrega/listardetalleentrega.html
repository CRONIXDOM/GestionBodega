<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="utf-8">
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-clipboard-data-fill" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Movimientos</p>
					<h1 class="h3 mb-1">Detalle Entrega</h1>
					<p class="text-muted mb-0">Detalle de las entregas registradas.</p>
				</div>
			</div>
			<div class="heading-actions">
				<a class="btn btn-primary btn-sm" th:href="@{/detalleentrega/nuevo}"><i class="bi bi-plus-circle"
					aria-hidden="true"></i> Nuevo</a>
			</div>
		</div>


		<div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
			<i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i> <span th:text="${error}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
		</div>
		<section class="panel mt-3">
			<div class="p-3 pb-0">
				<div class="input-group table-search" style="max-width: 340px;">
					<span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
					<input type="text" class="form-control" data-table-search="tablaDetalleentrega" placeholder="Buscar...">
				</div>
			</div>
			<div class="table-responsive">
				<table id="tablaDetalleentrega" class="table align-middle mb-0" data-page-size="15">
					<thead>
						<tr>
							<th scope="col">Id</th>
							<th scope="col">Producto</th>
							<th scope="col">Cantidad</th>
							<th scope="col">Código Evento</th>
							<th scope="col">Nombre Evento</th>
							<th scope="col">Id Entrega</th>
							<th scope="col">Detalle Solicitud</th>
							<th scope="col">Lote</th>
							<th scope="col" class="text-end">Acción</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="indice:${listadetalleentrega}">
							<td class="fw-semibold" th:text="${indice.idDetalleEntrega}"></td>
							<td th:with="p=${productos.get(indice.idProducto)}">
								<span th:if="${p != null}" class="badge bg-secondary-subtle text-body font-monospace me-1"
									th:text="${p.codigoProducto}"></span>
								<span th:text="${p != null} ? ${p.nombreProducto} : (${indice.idProducto != null} ? ('Producto #' + ${indice.idProducto}) : '—')"></span>
							</td>
							<td th:text="${indice.cantidadProducto}"></td>
							<td th:text="${indice.codigoEvento}"></td>
							<td th:text="${indice.nombreEvento}"></td>
							<td th:text="${indice.idEntrega}"></td>
							<td th:text="${indice.idDetalleSolicitud}"></td>
							<td th:text="${indice.idLote}"></td>
							<td class="text-end">
								<a class="btn btn-light btn-sm" th:href="@{/detalleentrega/editar/{id}(id=${indice.idDetalleEntrega})}"><i
									class="bi bi-pencil" aria-hidden="true"></i> Editar</a>
								<a class="btn btn-outline-danger btn-sm" th:href="@{/detalleentrega/eliminar/{id}(id=${indice.idDetalleEntrega})}"
									onclick="return confirm('¿Seguro que deseas eliminar?')"><i class="bi bi-trash"
									aria-hidden="true"></i> Eliminar</a>
							</td>
						</tr>
						<tr data-empty-row th:if="${#lists.isEmpty(listadetalleentrega)}">
							<td colspan="9" class="text-center text-muted py-4">Todavía no hay detalles de entrega registrados.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</body>
</html>
