<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="UTF-8">
<title>Registro</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-journal-text" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Inventario</p>
					<h1 class="h3 mb-1">Registro</h1>
					<p class="text-muted mb-0">Completa los datos del registro.</p>
				</div>
			</div>
		</div>

		<section class="row g-3 mt-1">
			<div class="col-12">
				<form class="panel" th:action="@{/registro/guardar}" th:object="${registro}" method="post">
					<input type="hidden" th:field="*{idRegistro}">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Fecha de Registro</label> <input class="form-control"
								type="date" th:field="*{fechaRegistro}">
						</div>
						<div class="col-md-6">
							<label class="form-label">Id de Lote</label> <select class="form-select"
								th:field="*{idLote}">
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesLote}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Id de Tipo</label> <select class="form-select"
								th:field="*{idTipo}">
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesTipo}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Id de Ubicación</label> <select class="form-select"
								th:field="*{idUbicacion}">
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesUbicacion}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Id de Detalle Entrega</label> <select class="form-select"
								th:field="*{idDetalleEntrega}">
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesDetalleEntrega}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Id de Usuario Rol</label> <select class="form-select"
								th:field="*{idUsuarioRol}">
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesUsuarioRol}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
						</div>
					</div>
					<div class="d-flex justify-content-end mt-4">
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check2-circle" aria-hidden="true"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</section>
	</div>
</body>
</html>
