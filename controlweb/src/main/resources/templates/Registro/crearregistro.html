<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="UTF-8">
<title>Registro</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-journal-text" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Movimientos</p>
					<h1 class="h3 mb-1">Registro</h1>
					<p class="text-muted mb-0">Completa los datos del registro.</p>
				</div>
			</div>
		</div>

		<section class="row g-3 mt-1">
			<div class="col-12">
				<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
				<form class="panel needs-validation" th:action="@{/registro/guardar}" th:object="${registro}"
					method="post" novalidate>
					<input type="hidden" th:field="*{idRegistro}">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Fecha de Registro <span class="text-danger">*</span></label>
							<input class="form-control" type="date" th:field="*{fechaRegistro}" required>
							<div class="invalid-feedback">La fecha de registro es obligatoria.</div>
						</div>
						<div class="col-md-6">
							<label class="form-label">Lote <span class="text-danger">*</span></label> <select
								class="form-select" th:field="*{idLote}" required>
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesLote}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
							<div class="invalid-feedback">Selecciona un lote.</div>
						</div>
						<div class="col-md-6">
							<label class="form-label">Tipo <span class="text-danger">*</span></label> <select
								class="form-select" th:field="*{idTipo}" required>
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesTipo}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
							<div class="invalid-feedback">Selecciona un tipo.</div>
						</div>
						<div class="col-md-6">
							<label class="form-label">Ubicación <span class="text-danger">*</span></label> <select
								class="form-select" th:field="*{idUbicacion}" required>
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesUbicacion}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
							<div class="invalid-feedback">Selecciona una ubicación.</div>
						</div>
						<div class="col-md-6">
							<label class="form-label">Detalle Entrega (opcional)</label> <select class="form-select"
								th:field="*{idDetalleEntrega}">
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesDetalleEntrega}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
							<div class="form-text">Solo aplica si este movimiento corresponde a una entrega de salida.</div>
						</div>
						<div class="col-md-6">
							<label class="form-label">Usuario Responsable <span class="text-danger">*</span></label>
							<select class="form-select" th:field="*{idUsuarioRol}" required>
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesUsuarioRol}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
							<div class="invalid-feedback">Selecciona quién realiza el registro.</div>
						</div>
					</div>
					<div class="d-flex justify-content-end gap-2 mt-4">
						<button class="btn btn-light" type="button" onclick="history.back()">
							<i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
						</button>
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check2-circle" aria-hidden="true"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</section>
	</div>
</body>
</html>
