<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="utf-8">
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-journal-text" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Inventario</p>
					<h1 class="h3 mb-1">Registros</h1>
					<p class="text-muted mb-0">Movimientos de inventario registrados.</p>
				</div>
			</div>
			<div class="heading-actions">
				<a class="btn btn-primary btn-sm" th:href="@{/registro/nuevo}"><i class="bi bi-plus-circle"
					aria-hidden="true"></i> Nuevo</a>
			</div>
		</div>

		<section class="panel mt-3">
			<div class="table-responsive">
				<table class="table align-middle mb-0">
					<thead>
						<tr>
							<th scope="col">Id</th>
							<th scope="col">Fecha</th>
							<th scope="col">Id Lote</th>
							<th scope="col">Id Tipo</th>
							<th scope="col">Id Ubicación</th>
							<th scope="col">Id Detalle Entrega</th>
							<th scope="col">Id Usuario Rol</th>
							<th scope="col" class="text-end">Acción</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="indice:${listaregistro}">
							<td class="fw-semibold" th:text="${indice.idRegistro}"></td>
							<td th:text="${indice.fechaRegistro}"></td>
							<td th:text="${indice.idLote}"></td>
							<td th:text="${indice.idTipo}"></td>
							<td th:text="${indice.idUbicacion}"></td>
							<td th:text="${indice.idDetalleEntrega}"></td>
							<td th:text="${indice.idUsuarioRol}"></td>
							<td class="text-end">
								<a class="btn btn-light btn-sm" th:href="@{/registro/editar/{id}(id=${indice.idRegistro})}"><i
									class="bi bi-pencil" aria-hidden="true"></i> Editar</a>
								<a class="btn btn-outline-danger btn-sm" th:href="@{/registro/eliminar/{id}(id=${indice.idRegistro})}"
									onclick="return confirm('¿Seguro que deseas eliminar?')"><i class="bi bi-trash"
									aria-hidden="true"></i> Eliminar</a>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(listaregistro)}">
							<td colspan="8" class="text-center text-muted py-4">Todavía no hay registros registrados.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</body>
</html>
