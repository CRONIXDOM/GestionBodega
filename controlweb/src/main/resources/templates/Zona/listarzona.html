<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="utf-8">
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-diagram-3" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Sedes y Ubicaciones</p>
					<h1 class="h3 mb-1">Zonas</h1>
					<p class="text-muted mb-0">Zonas registradas en la bodega.</p>
				</div>
			</div>
			<div class="heading-actions">
				<a class="btn btn-primary btn-sm" th:href="@{/zona/nuevo}"><i class="bi bi-plus-circle"
					aria-hidden="true"></i> Nuevo</a>
			</div>
		</div>

		<section class="panel mt-3">
			<div class="p-3 pb-0">
				<div class="input-group table-search" style="max-width: 340px;">
					<span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
					<input type="text" class="form-control" data-table-search="tablaZona" placeholder="Buscar...">
				</div>
			</div>
			<div class="table-responsive">
				<table id="tablaZona" class="table align-middle mb-0" data-page-size="15">
					<thead>
						<tr>
							<th scope="col">Id</th>
							<th scope="col">Nombre</th>
							<th scope="col">Descripción</th>
							<th scope="col">Almacenado</th>
							<th scope="col" class="text-end">Acción</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="indice:${listazona}">
							<td class="fw-semibold" th:text="${indice.idZona}"></td>
							<td th:text="${indice.nombreZona}"></td>
							<td th:text="${indice.descripcion}"></td>
							<td th:with="ocu=${ocupado.getOrDefault(indice.idZona, 0)}">
								<span class="badge bg-secondary-subtle text-body"
									th:text="${ocu} + ' unidades'">0 unidades</span>
							</td>
							<td class="text-end">
								<a class="btn btn-light btn-sm" th:href="@{/zona/editar/{id}(id=${indice.idZona})}"><i
									class="bi bi-pencil" aria-hidden="true"></i> Editar</a>
								<a class="btn btn-outline-danger btn-sm" th:href="@{/zona/eliminar/{id}(id=${indice.idZona})}"
									onclick="return confirm('¿Seguro que deseas eliminar?')"><i class="bi bi-trash"
									aria-hidden="true"></i> Eliminar</a>
							</td>
						</tr>
						<tr data-empty-row th:if="${#lists.isEmpty(listazona)}">
							<td colspan="5" class="text-center text-muted py-4">Todavía no hay zonas registradas.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</body>
</html>
