<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="UTF-8">
<title>Detalle Solicitud</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-list-check" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Movimientos</p>
					<h1 class="h3 mb-1">Reservar Stock</h1>
					<p class="text-muted mb-0">Al guardar, la cantidad se reserva de inmediato (se descuenta de lo
						disponible del lote elegido o del más antiguo por FIFO).</p>
				</div>
			</div>
		</div>

		<section class="row g-3 mt-1">
			<div class="col-12">
				<form class="panel" th:action="@{/detallesolicitud/guardar}" th:object="${detalleSolicitud}" method="post">
					<input type="hidden" th:field="*{idDetalleSolicitud}">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Id del Producto</label> <select class="form-select"
								th:field="*{idProducto}">
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesProducto}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Cantidad del Producto</label> <input class="form-control"
								type="number" th:field="*{cantidadProducto}">
						</div>
						<div class="col-md-6">
							<label class="form-label">Lugar de Recogida</label> <input class="form-control"
								th:field="*{lugarRecogida}">
						</div>
						<div class="col-md-6">
							<label class="form-label">Lote específico (opcional)</label> <select class="form-select"
								th:field="*{idLote}">
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesLote}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
							<div class="form-text">Si no eliges uno, se usa automáticamente el lote más antiguo (FIFO).</div>
						</div>
						<div class="col-md-6">
							<label class="form-label">Solicitud</label> <select class="form-select"
								th:field="*{idSolicitud}">
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesSolicitud}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
						</div>
					</div>
					<div class="d-flex justify-content-end gap-2 mt-4">
						<button class="btn btn-light" type="button" onclick="history.back()">
							<i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
						</button>
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check2-circle" aria-hidden="true"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</section>
	</div>
</body>
</html>
