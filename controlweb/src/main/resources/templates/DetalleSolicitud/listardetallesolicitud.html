<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="utf-8">
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-list-check" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Movimientos</p>
					<h1 class="h3 mb-1">Reservas</h1>
					<p class="text-muted mb-0">Stock reservado por cada solicitud.</p>
				</div>
			</div>
			<div class="heading-actions">
				<a class="btn btn-primary btn-sm" th:href="@{/detallesolicitud/nuevo}"><i class="bi bi-plus-circle"
					aria-hidden="true"></i> Nuevo</a>
			</div>
		</div>


		<div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
			<i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i> <span th:text="${error}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
		</div>
		<section class="panel mt-3">
			<div class="p-3 pb-0">
				<div class="input-group table-search" style="max-width: 340px;">
					<span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
					<input type="text" class="form-control" data-table-search="tablaDetallesolicitud" placeholder="Buscar...">
				</div>
			</div>
			<div class="table-responsive">
				<table id="tablaDetallesolicitud" class="table align-middle mb-0" data-page-size="15">
					<thead>
						<tr>
							<th scope="col">Id</th>
							<th scope="col">Producto</th>
							<th scope="col">Cantidad</th>
							<th scope="col">Lugar Recogida</th>
							<th scope="col">Id Solicitud</th>
							<th scope="col">Lotes Usados</th>
							<th scope="col" class="text-end">Acción</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="indice:${listadetallesolicitud}">
							<td class="fw-semibold" th:text="${indice.idDetalleSolicitud}"></td>
							<td th:with="p=${productos.get(indice.idProducto)}">
								<span th:if="${p != null}" class="badge bg-secondary-subtle text-body font-monospace me-1"
									th:text="${p.codigoProducto}"></span>
								<span th:text="${p != null} ? ${p.nombreProducto} : ('Producto #' + ${indice.idProducto})"></span>
							</td>
							<td th:with="p=${productos.get(indice.idProducto)},cant=${indice.cantidadProducto}">
								<span class="fw-semibold" th:text="${cant} + ' u.'">0 u.</span>
								<div th:if="${p != null and p.unidadesPorCaja != null and p.unidadesPorCaja > 0}"
									class="small text-muted"
									th:with="cajas=${cant / p.unidadesPorCaja},extra=${cant % p.unidadesPorCaja}">
									<span th:if="${cajas > 0}" th:text="${cajas} + ' caja(s) de ' + ${p.unidadesPorCaja}"></span>
									<span th:if="${cajas > 0 and extra > 0}"> + </span>
									<span th:if="${extra > 0}" th:text="${extra} + ' unidad(es) suelta(s)'"></span>
								</div>
							</td>
							<td th:text="${indice.lugarRecogida}"></td>
							<td th:text="${indice.idSolicitud}"></td>
							<td th:if="${indice.lotesAsignados != null}">
								<span class="badge text-bg-light me-1" th:each="la : ${indice.lotesAsignados}"
									th:text="${la.numeroLote} + ' (' + ${la.cantidad} + ')'"></span>
							</td>
							<td th:if="${indice.lotesAsignados == null}"></td>
							<td class="text-end">
								<a class="btn btn-light btn-sm" th:href="@{/detallesolicitud/editar/{id}(id=${indice.idDetalleSolicitud})}"><i
									class="bi bi-pencil" aria-hidden="true"></i> Editar</a>
								<a class="btn btn-outline-danger btn-sm" th:href="@{/detallesolicitud/eliminar/{id}(id=${indice.idDetalleSolicitud})}"
									onclick="return confirm('¿Seguro que deseas eliminar?')"><i class="bi bi-trash"
									aria-hidden="true"></i> Eliminar</a>
							</td>
						</tr>
						<tr data-empty-row th:if="${#lists.isEmpty(listadetallesolicitud)}">
							<td colspan="7" class="text-center text-muted py-4">Todavía no hay detalles de solicitud registrados.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</body>
</html>
