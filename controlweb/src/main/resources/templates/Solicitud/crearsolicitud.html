<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="UTF-8">
<title>Solicitud</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<h1 class="mb-6 text-2xl font-bold text-navy-700">Registro Solicitud</h1>
		<div
			class="relative max-w-xl rounded-[20px] bg-white p-6 shadow-3xl shadow-shadow-500">
			<form th:action="@{/solicitud/guardar}" th:object="${solicitud}"
				method="post">
				<input type="hidden" th:field="*{idSolicitud}">
				<div class="mb-4">
					<label class="ml-1 text-sm font-bold text-navy-700">Fecha
						de Solicitud</label>
					<input type="date" th:field="*{fechaSolicitud}"
						class="mt-2 flex h-12 w-full rounded-xl border border-gray-200 bg-white/0 p-3 text-sm outline-none focus:border-brand-500">
				</div>
				<div class="mb-4">
					<label class="ml-1 text-sm font-bold text-navy-700">Estado
						de Solicitud</label>
					<select th:field="*{estadoSolicitud}"
						class="mt-2 flex h-12 w-full rounded-xl border border-gray-200 bg-white p-3 text-sm outline-none focus:border-brand-500">
						<option value="">Seleccione</option>
						<option th:value="true">Activa</option>
						<option th:value="false">Inactiva</option>
					</select>
				</div>
				<div class="mb-4">
					<label class="ml-1 text-sm font-bold text-navy-700">Id
						de Usuario Rol</label>
					<select th:field="*{idUsuarioRol}"
						class="mt-2 flex h-12 w-full rounded-xl border border-gray-200 bg-white p-3 text-sm outline-none focus:border-brand-500">
						<option value="">Seleccione...</option>
						<option th:each="op : ${opcionesUsuarioRol}" th:value="${op.id}"
							th:text="${op.etiqueta}"></option>
					</select>
				</div>
				<button type="submit"
					class="linear mt-2 w-full rounded-xl bg-brand-500 py-3 text-base font-medium text-white transition duration-200 hover:bg-brand-600 active:bg-brand-700">Guardar</button>
			</form>
		</div>
	</div>
</body>
</html>
