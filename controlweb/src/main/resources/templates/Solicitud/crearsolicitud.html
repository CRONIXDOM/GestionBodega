<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="UTF-8">
<title>Solicitud</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-clipboard-check" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Movimientos</p>
					<h1 class="h3 mb-1">Registro de Solicitud</h1>
					<p class="text-muted mb-0">Completa los datos de la solicitud.</p>
				</div>
			</div>
		</div>

		<section class="row g-3 mt-1">
			<div class="col-12 col-xl-7">
				<form class="panel" th:action="@{/solicitud/guardar}" th:object="${solicitud}" method="post">
					<input type="hidden" th:field="*{idSolicitud}">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Fecha de Solicitud</label> <input class="form-control"
								type="date" th:field="*{fechaSolicitud}">
						</div>
						<div class="col-md-6">
							<label class="form-label">Estado de Solicitud</label> <select class="form-select"
								th:field="*{estadoSolicitud}">
								<option value="">Seleccione</option>
								<option th:value="true">Activa</option>
								<option th:value="false">Inactiva</option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Id de Usuario Rol</label> <select class="form-select"
								th:field="*{idUsuarioRol}">
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesUsuarioRol}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
						</div>
					</div>
					<div class="d-flex justify-content-end gap-2 mt-4">
						<button class="btn btn-light" type="button" onclick="history.back()">
							<i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
						</button>
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check2-circle" aria-hidden="true"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</section>
	</div>
</body>
</html>
