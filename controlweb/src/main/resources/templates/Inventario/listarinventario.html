<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="utf-8">
<title>Existencias</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-clipboard-data" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Inventario</p>
					<h1 class="h3 mb-1">Existencias</h1>
					<p class="text-muted mb-0">Resumen de existencias por producto.</p>
				</div>
			</div>
		</div>

		<section class="panel mt-3">
			<div class="table-responsive">
				<table class="table align-middle mb-0">
					<thead>
						<tr>
							<th scope="col">Producto</th>
							<th scope="col">Código</th>
							<th scope="col">N° Lotes</th>
							<th scope="col">Cantidad Total</th>
							<th scope="col">Reservada</th>
							<th scope="col">Disponible</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="indice:${listainventario}">
							<td class="fw-semibold" th:text="${indice.nombreProducto}"></td>
							<td th:text="${indice.codigoProducto}"></td>
							<td th:text="${indice.numeroLotes}"></td>
							<td th:text="${indice.cantidadTotal}"></td>
							<td th:text="${indice.cantidadReservada}"></td>
							<td th:text="${indice.cantidadDisponible}"></td>
						</tr>
						<tr th:if="${#lists.isEmpty(listainventario)}">
							<td colspan="6" class="text-center text-muted py-4">Todavía no hay existencias registradas.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</body>
</html>
