<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="UTF-8">
<title>Rol</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-shield-lock" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Accesos</p>
					<h1 class="h3 mb-1">Registro de Rol</h1>
					<p class="text-muted mb-0">Completa los datos del rol.</p>
				</div>
			</div>
		</div>

		<section class="row g-3 mt-1">
			<div class="col-12">
				<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
				<form class="panel needs-validation" th:action="@{/rol/guardar}" th:object="${rol}" method="post"
					novalidate>
					<input type="hidden" th:field="*{idRol}">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Nombre del Rol <span class="text-danger">*</span></label>
							<input class="form-control" th:field="*{nombreRol}" required>
							<div class="invalid-feedback">El nombre del rol es obligatorio.</div>
						</div>
						<div class="col-12">
							<label class="form-label">Descripción del Rol <span class="text-danger">*</span></label>
							<textarea class="form-control" th:field="*{descripcionRol}" rows="3" required></textarea>
						</div>
					</div>

					<hr class="my-4">

					<h2 class="h6 mb-1">Acceso a módulos</h2>
					<p class="text-muted small mb-3">Marca las secciones a las que este rol puede entrar. Las que
						dejes sin marcar no aparecerán en el menú y quedarán bloqueadas para quien tenga este rol.</p>

					<div class="row g-3" th:each="grupo : ${modulosPorGrupo}">
						<div class="col-12">
							<span class="text-uppercase text-muted small fw-bold d-block mb-2" th:text="${grupo.key}"></span>
							<div class="row g-2">
								<div class="col-6 col-md-4 col-xl-3" th:each="opcion : ${grupo.value}">
									<div class="form-check form-switch">
										<input class="form-check-input" type="checkbox" name="modulos"
											th:id="${'modulo-' + opcion.clave()}" th:value="${opcion.clave()}"
											th:checked="${modulosSeleccionados.contains(opcion.clave())}">
										<label class="form-check-label" th:for="${'modulo-' + opcion.clave()}"
											th:text="${opcion.etiqueta()}"></label>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="d-flex justify-content-end gap-2 mt-4">
						<button class="btn btn-light" type="button" onclick="history.back()">
							<i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
						</button>
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check2-circle" aria-hidden="true"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</section>
	</div>
</body>
</html>
