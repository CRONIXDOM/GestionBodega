<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="utf-8">
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-building" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Bodegas · Detalle</p>
					<h1 class="h3 mb-1" th:text="${sede.nombreSede}">Bodega</h1>
					<p class="text-muted mb-0">
						<span th:text="${sede.direccion}"></span>
						<span th:if="${sede.descripcion}"> · <span th:text="${sede.descripcion}"></span></span>
						<span th:if="${zona}"> · Zona <span th:text="${zona}"></span></span>
					</p>
				</div>
			</div>
			<div class="heading-actions">
				<a class="btn btn-light btn-sm" th:href="@{/bodega}"><i class="bi bi-arrow-left"
					aria-hidden="true"></i> Volver</a>
			</div>
		</div>

		<!-- resumen de ocupación -->
		<section class="row g-3 mt-1"
			th:with="cap=${sede.capacidad},libreAhora=${(cap != null and cap > 0) ? cap - ocupado : 0}">
			<div class="col-6 col-lg-3">
				<div class="panel p-3 h-100">
					<div class="text-muted small text-uppercase">En bodega</div>
					<div class="h3 mb-0" th:text="${ocupado}">0</div>
					<div class="text-muted small">unidades físicas</div>
				</div>
			</div>
			<div class="col-6 col-lg-3">
				<div class="panel p-3 h-100">
					<div class="text-muted small text-uppercase">Lotes</div>
					<div class="h3 mb-0" th:text="${lotes}">0</div>
					<div class="text-muted small">guardados aquí</div>
				</div>
			</div>
			<div class="col-6 col-lg-3">
				<div class="panel p-3 h-100">
					<div class="text-muted small text-uppercase">Reservado</div>
					<div class="h3 mb-0 text-warning" th:text="${reservado}">0</div>
					<div class="text-muted small">apartado para salir</div>
				</div>
			</div>
			<div class="col-6 col-lg-3">
				<div class="panel p-3 h-100">
					<div class="text-muted small text-uppercase">Libre al despachar</div>
					<div class="h3 mb-0 text-success"
						th:text="${(cap != null and cap > 0)} ? ${libreAhora + reservado} : '—'">0</div>
					<div class="text-muted small">de <span th:text="${cap} ?: '—'">0</span> de capacidad</div>
				</div>
			</div>
		</section>

		<!-- qué productos guarda y en cuántos lotes vienen -->
		<section class="panel mt-3">
			<div class="p-3 border-bottom">
				<h2 class="h6 mb-0"><i class="bi bi-box-seam" aria-hidden="true"></i> Productos guardados</h2>
			</div>
			<div class="table-responsive">
				<table class="table align-middle mb-0">
					<thead>
						<tr>
							<th scope="col">Código</th>
							<th scope="col" style="min-width: 240px;">Producto</th>
							<th scope="col">Lotes</th>
							<th scope="col">Unidades</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="l : ${contenido}">
							<td><span class="badge bg-secondary-subtle text-body font-monospace"
								th:text="${l.codigoProducto} ?: '—'"></span></td>
							<td th:text="${l.nombreProducto}"></td>
							<td><span class="badge bg-info-subtle text-info" th:text="${l.lotes}">0</span></td>
							<td><span class="fw-semibold" th:text="${l.cantidad}">0</span>
								<span class="text-muted small">u.</span></td>
						</tr>
						<tr th:if="${#lists.isEmpty(contenido)}">
							<td colspan="4" class="text-center text-muted py-4">Esta bodega todavía está vacía.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</body>
</html>
