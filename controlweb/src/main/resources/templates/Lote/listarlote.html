<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="utf-8">
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-boxes" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Inventario</p>
					<h1 class="h3 mb-1">Lotes</h1>
					<p class="text-muted mb-0">Lotes registrados y su disponibilidad de stock.</p>
				</div>
			</div>
			<div class="heading-actions">
				<a class="btn btn-primary btn-sm" th:href="@{/lote/nuevo}"><i class="bi bi-plus-circle"
					aria-hidden="true"></i> Nuevo</a>
			</div>
		</div>

		<section class="panel mt-3">
			<div class="p-3 pb-0">
				<div class="input-group table-search" style="max-width: 340px;">
					<span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
					<input type="text" class="form-control" data-table-search="tablaLote" placeholder="Buscar...">
				</div>
			</div>
			<div class="table-responsive">
				<table id="tablaLote" class="table align-middle mb-0" data-page-size="15">
					<thead>
						<tr>
							<th scope="col">Id</th>
							<th scope="col">Número</th>
							<th scope="col">Fecha Ingreso</th>
							<th scope="col">Fecha Vencimiento</th>
							<th scope="col">Cantidad</th>
							<th scope="col">Reservada</th>
							<th scope="col">Disponible</th>
							<th scope="col">Id Producto</th>
							<th scope="col">Ubicación</th>
							<th scope="col" class="text-end">Acción</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="indice:${listalote}">
							<td class="fw-semibold" th:text="${indice.idLote}"></td>
							<td th:text="${indice.numeroLote}"></td>
							<td th:text="${indice.fechaIngreso}"></td>
							<td>
								<span th:text="${indice.fechaVencimiento}"></span>
								<span
									th:if="${indice.fechaVencimiento != null and indice.fechaVencimiento.isBefore(T(java.time.LocalDate).now())}"
									class="badge text-bg-danger ms-1">Vencido</span>
								<span
									th:if="${indice.fechaVencimiento != null and !indice.fechaVencimiento.isBefore(T(java.time.LocalDate).now()) and indice.fechaVencimiento.isBefore(T(java.time.LocalDate).now().plusDays(30))}"
									class="badge text-bg-warning ms-1">Por vencer</span>
							</td>
							<td th:text="${indice.cantidadLote}"></td>
							<td><span class="badge text-bg-warning" th:text="${indice.cantidadReservada}"></span></td>
							<td><span class="badge text-bg-success" th:text="${indice.cantidadDisponible}"></span></td>
							<td th:text="${indice.idProducto}"></td>
							<td th:text="${indice.idUbicacion}"></td>
							<td class="text-end">
								<a class="btn btn-warning btn-sm"
									th:href="@{/detallesolicitud/nuevo(idLote=${indice.idLote},idProducto=${indice.idProducto})}"><i
									class="bi bi-bookmark-check" aria-hidden="true"></i> Reservar</a>
								<a class="btn btn-light btn-sm" th:href="@{/lote/editar/{id}(id=${indice.idLote})}"><i
									class="bi bi-pencil" aria-hidden="true"></i> Editar</a>
								<a class="btn btn-outline-danger btn-sm" th:href="@{/lote/eliminar/{id}(id=${indice.idLote})}"
									onclick="return confirm('¿Seguro que deseas eliminar?')"><i class="bi bi-trash"
									aria-hidden="true"></i> Eliminar</a>
							</td>
						</tr>
						<tr data-empty-row th:if="${#lists.isEmpty(listalote)}">
							<td colspan="10" class="text-center text-muted py-4">Todavía no hay lotes registrados.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</body>
</html>
