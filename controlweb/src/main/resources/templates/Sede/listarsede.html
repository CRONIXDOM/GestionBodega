<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="utf-8">
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-building" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Catálogo</p>
					<h1 class="h3 mb-1">Sedes</h1>
					<p class="text-muted mb-0">Sedes o sucursales donde opera la bodega.</p>
				</div>
			</div>
			<div class="heading-actions">
				<a class="btn btn-primary btn-sm" th:href="@{/sede/nuevo}"><i class="bi bi-plus-circle"
					aria-hidden="true"></i> Nuevo</a>
			</div>
		</div>

		<section class="panel mt-3">
			<div class="p-3 pb-0">
				<div class="input-group table-search" style="max-width: 340px;">
					<span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
					<input type="text" class="form-control" data-table-search="tablaSede" placeholder="Buscar...">
				</div>
			</div>
			<div class="table-responsive">
				<table id="tablaSede" class="table align-middle mb-0" data-page-size="15">
					<thead>
						<tr>
							<th scope="col">Id</th>
							<th scope="col">Nombre</th>
							<th scope="col">Dirección</th>
							<th scope="col">Descripción</th>
							<th scope="col" class="text-end">Acción</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="indice:${listasede}">
							<td class="fw-semibold" th:text="${indice.idSede}"></td>
							<td th:text="${indice.nombreSede}"></td>
							<td th:text="${indice.direccion}"></td>
							<td th:text="${indice.descripcion}"></td>
							<td class="text-end">
								<a class="btn btn-light btn-sm" th:href="@{/sede/editar/{id}(id=${indice.idSede})}"><i
									class="bi bi-pencil" aria-hidden="true"></i> Editar</a>
								<a class="btn btn-outline-danger btn-sm" th:href="@{/sede/eliminar/{id}(id=${indice.idSede})}"
									onclick="return confirm('¿Seguro que deseas eliminar?')"><i class="bi bi-trash"
									aria-hidden="true"></i> Eliminar</a>
							</td>
						</tr>
						<tr data-empty-row th:if="${#lists.isEmpty(listasede)}">
							<td colspan="5" class="text-center text-muted py-4">Todavía no hay sedes registradas.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</body>
</html>
