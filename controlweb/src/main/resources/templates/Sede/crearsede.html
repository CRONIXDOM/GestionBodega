<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="UTF-8">
<title>Sede</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-building" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Sedes y Ubicaciones</p>
					<h1 class="h3 mb-1">Registro de Sede</h1>
					<p class="text-muted mb-0">Completa los datos de la sede.</p>
				</div>
			</div>
		</div>

		<section class="row g-3 mt-1">
			<div class="col-12 col-xl-7">
				<form class="panel needs-validation" th:action="@{/sede/guardar}" th:object="${sede}" method="post"
					novalidate>
					<input type="hidden" th:field="*{idSede}">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Nombre de la Sede <span class="text-danger">*</span></label>
							<input class="form-control" th:field="*{nombreSede}" required>
							<div class="invalid-feedback">El nombre de la sede es obligatorio.</div>
						</div>
						<div class="col-md-6">
							<label class="form-label">Dirección</label> <input class="form-control"
								th:field="*{direccion}">
						</div>
						<div class="col-12">
							<label class="form-label">Descripción</label>
							<textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea>
						</div>
					</div>
					<div class="d-flex justify-content-end gap-2 mt-4">
						<button class="btn btn-light" type="button" onclick="history.back()">
							<i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
						</button>
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check2-circle" aria-hidden="true"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</section>
	</div>
</body>
</html>
