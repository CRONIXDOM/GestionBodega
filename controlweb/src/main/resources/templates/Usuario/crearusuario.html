<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="UTF-8">
<title>Usuario</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-people" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Accesos</p>
					<h1 class="h3 mb-1">Registro de Usuario</h1>
					<p class="text-muted mb-0">Completa los datos del usuario.</p>
				</div>
			</div>
		</div>

		<section class="row g-3 mt-1">
			<div class="col-12 col-xl-7">
				<form class="panel" th:action="@{/usuario/guardar}" th:object="${usuario}" method="post">
					<input type="hidden" th:field="*{idUsuario}">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Nombre del Usuario</label> <input class="form-control"
								th:field="*{nombreUsuario}">
						</div>
						<div class="col-md-6">
							<label class="form-label">Apellido del Usuario</label> <input class="form-control"
								th:field="*{apellidoUsuario}">
						</div>
						<div class="col-md-6">
							<label class="form-label">Estado</label> <select class="form-select"
								th:field="*{estado}">
								<option value="">Seleccione</option>
								<option value="Activo">Activo</option>
								<option value="Inactivo">Inactivo</option>
							</select>
						</div>
					</div>
					<div th:if="${usuario.idUsuario == null}">
						<div class="form-text mt-3 mb-2">Estos datos crean también el acceso de inicio de sesión del usuario.</div>
						<div class="row g-3">
							<div class="col-md-6">
								<label class="form-label">Contraseña</label> <input class="form-control"
									type="password" th:field="*{contrasena}">
							</div>
							<div class="col-md-6">
								<label class="form-label">Correo</label> <input class="form-control"
									type="email" th:field="*{correo}">
							</div>
						</div>
					</div>
					<div class="row g-3 mt-0">
						<div class="col-md-6">
							<label class="form-label">Rol</label> <select class="form-select"
								th:field="*{idRol}">
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesRol}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
						</div>
					</div>
					<div class="d-flex justify-content-end gap-2 mt-4">
						<button class="btn btn-light" type="button" onclick="history.back()">
							<i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
						</button>
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check2-circle" aria-hidden="true"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</section>
	</div>
</body>
</html>
