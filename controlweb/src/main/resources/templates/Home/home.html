<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">

<head>
<meta charset="utf-8">
</head>

<body>
	<div layout:fragment="contenidopaginas">
		<div th:if="${session.mensajeError}"
			class="mb-4 rounded-xl bg-red-50 px-4 py-3 text-sm font-medium text-red-500"
			th:text="${session.mensajeError}"></div>
		<div
			class="relative flex flex-col rounded-[20px] bg-white p-6 shadow-3xl shadow-shadow-500">
			<h1 class="text-2xl font-bold text-navy-700">Bienvenido, <span
				th:text="${session.usuarioLogueado}">Usuario</span></h1>
			<p class="mt-2 text-base text-gray-600">Panel de control del
				sistema de bodega.</p>
		</div>
	</div>
</body>
</html>
