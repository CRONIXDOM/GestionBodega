<!DOCTYPE html>
<html lang="es" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar acceso | Control Bodega</title>

<link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/assets/vendors/bootstrap-icons/bootstrap-icons.css}">
<link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>

<body class="auth-body">
	<main class="auth-page">
		<section class="auth-card">
			<a class="auth-brand" th:href="@{/login}"><span class="brand-icon"><i
					class="bi bi-box-seam-fill" aria-hidden="true"></i></span> <span><strong>Control
						Bodega</strong><small>Sistema de gestión de inventario.</small></span>
			</a>

			<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

			<div th:unless="${cuenta}">
				<form th:action="@{/recuperar/buscar}" method="post">
					<div class="mb-4">
						<p class="eyebrow mb-1">Recuperar acceso</p>
						<h1 class="h3 mb-1">¿Olvidaste tu usuario o contraseña?</h1>
						<p class="text-muted mb-0">Ingresa el correo con el que registraste tu cuenta.</p>
					</div>
					<div class="mb-4">
						<label class="form-label" for="correo">Correo</label> <input
							class="form-control" id="correo" name="correo" type="email" required autofocus>
					</div>
					<button class="btn btn-primary w-100" type="submit">
						<i class="bi bi-search" aria-hidden="true"></i> Buscar cuenta
					</button>
				</form>
			</div>

			<div th:if="${cuenta}">
				<div class="mb-4">
					<p class="eyebrow mb-1">Cuenta encontrada</p>
					<h1 class="h3 mb-1">Restablecer contraseña</h1>
					<p class="text-muted mb-0">Tu usuario es <strong th:text="${cuenta.usuario}"></strong>. Define una
						nueva contraseña para continuar.</p>
				</div>
				<form th:action="@{/recuperar/restablecer}" method="post">
					<input type="hidden" name="idCredenciales" th:value="${cuenta.idCredenciales}">
					<input type="hidden" name="correo" th:value="${cuenta.correo}">
					<div class="mb-3">
						<label class="form-label" for="nuevaContrasena">Nueva contraseña</label> <input
							class="form-control" id="nuevaContrasena" name="nuevaContrasena" type="password" required
							autofocus>
					</div>
					<div class="mb-4">
						<label class="form-label" for="confirmarContrasena">Confirmar contraseña</label> <input
							class="form-control" id="confirmarContrasena" name="confirmarContrasena" type="password"
							required>
					</div>
					<button class="btn btn-primary w-100" type="submit">
						<i class="bi bi-check2-circle" aria-hidden="true"></i> Guardar nueva contraseña
					</button>
				</form>
			</div>

			<div class="text-center mt-3">
				<a th:href="@{/login}" class="text-muted"><i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
					a iniciar sesión</a>
			</div>
		</section>
	</main>

	<script th:src="@{/assets/js/bootstrap.bundle.min.js}"></script>
	<script th:src="@{/assets/js/main.js}"></script>
</body>
</html>
