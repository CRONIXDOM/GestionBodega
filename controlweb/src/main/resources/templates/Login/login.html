<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar Sesión | Control Bodega</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link
	href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap"
	rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
	tailwind.config = {
		theme: {
			extend: {
				fontFamily: { dm: ['DM Sans', 'sans-serif'] },
				colors: {
					lightPrimary: '#F4F7FE',
					brand: {
						50: '#E9E3FF', 100: '#C0B8FE', 200: '#A195FD', 300: '#8171FC',
						400: '#7551FF', 500: '#422AFB', 600: '#3311DB', 700: '#2111A5',
						800: '#190793', 900: '#11047A'
					},
					navy: {
						50: '#d0dcfb', 100: '#aac0fe', 200: '#a3b9f8', 300: '#728fea',
						400: '#3652ba', 500: '#1b3bbb', 600: '#24388a', 700: '#1B254B',
						800: '#111c44', 900: '#0b1437'
					}
				}
			}
		}
	}
</script>
<style>
body { font-family: 'DM Sans', sans-serif; }
</style>
</head>

<body class="flex min-h-screen items-center justify-center bg-white">
	<main class="flex w-full max-w-[420px] flex-col px-4">
		<h4 class="mb-2.5 text-4xl font-bold text-navy-700">Iniciar Sesión</h4>
		<p class="mb-9 text-base text-gray-600">Ingresa tu usuario y
			contraseña para acceder al panel.</p>

		<div th:if="${error}"
			class="mb-6 rounded-xl bg-red-50 px-4 py-3 text-sm font-medium text-red-500"
			th:text="${error}"></div>

		<form th:action="@{/login}" method="post">
			<div class="mb-4">
				<label for="usuario" class="ml-1.5 text-sm font-medium text-navy-700">Usuario</label>
				<input type="text" id="usuario" name="usuario" required autofocus
					class="mt-2 flex h-12 w-full items-center rounded-xl border border-gray-200 bg-white/0 p-3 text-sm outline-none focus:border-brand-500">
			</div>
			<div class="mb-6">
				<label for="contrasena"
					class="ml-1.5 text-sm font-medium text-navy-700">Contraseña</label>
				<input type="password" id="contrasena" name="contrasena" required
					class="mt-2 flex h-12 w-full items-center rounded-xl border border-gray-200 bg-white/0 p-3 text-sm outline-none focus:border-brand-500">
			</div>
			<button type="submit"
				class="linear w-full rounded-xl bg-brand-500 py-3 text-base font-medium text-white transition duration-200 hover:bg-brand-600 active:bg-brand-700">Ingresar</button>
		</form>
	</main>
</body>
</html>
