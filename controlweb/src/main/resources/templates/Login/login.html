<!DOCTYPE html>
<html lang="es" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar Sesión | Control Bodega</title>

<link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/assets/vendors/bootstrap-icons/bootstrap-icons.css}">
<link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>

<body class="auth-body">
	<main class="auth-page">
		<section class="auth-card">
			<a class="auth-brand" th:href="@{/login}"><span class="brand-icon"><i
					class="bi bi-box-seam-fill" aria-hidden="true"></i></span> <span><strong>Control
						Bodega</strong><small>Sistema de gestión de inventario.</small></span>
			</a>

			<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

			<form th:action="@{/login}" method="post">
				<div class="mb-4">
					<p class="eyebrow mb-1">Acceso restringido</p>
					<h1 class="h3 mb-1">Iniciar Sesión</h1>
					<p class="text-muted mb-0">Ingresa tu usuario y contraseña para acceder al panel.</p>
				</div>
				<div class="mb-3">
					<label class="form-label" for="usuario">Usuario</label> <input
						class="form-control" id="usuario" name="usuario" type="text" required autofocus>
				</div>
				<div class="mb-4">
					<label class="form-label" for="contrasena">Contraseña</label> <input
						class="form-control" id="contrasena" name="contrasena" type="password" required>
				</div>
				<button class="btn btn-primary w-100" type="submit">
					<i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Ingresar
				</button>
			</form>
		</section>
	</main>

	<script th:src="@{/assets/js/bootstrap.bundle.min.js}"></script>
	<script th:src="@{/assets/js/main.js}"></script>
</body>
</html>
