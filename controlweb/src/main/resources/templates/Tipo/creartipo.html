<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="UTF-8">
<title>Tipo</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-tags" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Catálogo</p>
					<h1 class="h3 mb-1">Registro de Tipo</h1>
					<p class="text-muted mb-0">Completa los datos del tipo.</p>
				</div>
			</div>
		</div>

		<section class="row g-3 mt-1">
			<div class="col-12 col-xl-7">
				<form class="panel" th:action="@{/tipo/guardar}" th:object="${tipo}" method="post">
					<input type="hidden" th:field="*{idTipo}">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Descripción</label> <input class="form-control"
								th:field="*{descripcion}">
						</div>
						<div class="col-md-6">
							<label class="form-label">Clase</label> <input class="form-control"
								th:field="*{clase}">
						</div>
					</div>
					<div class="d-flex justify-content-end mt-4">
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check2-circle" aria-hidden="true"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</section>
	</div>
</body>
</html>
