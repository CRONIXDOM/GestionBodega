<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="UTF-8">
<title>Credenciales</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-key" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Accesos</p>
					<h1 class="h3 mb-1">Registro de Credenciales</h1>
					<p class="text-muted mb-0">Completa los datos de acceso.</p>
				</div>
			</div>
		</div>

		<section class="row g-3 mt-1">
			<div class="col-12 col-xl-7">
				<form class="panel" th:action="@{/credenciales/guardar}" th:object="${credenciales}" method="post">
					<input type="hidden" th:field="*{idCredenciales}">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Usuario</label> <input class="form-control"
								th:field="*{usuario}">
						</div>
						<div class="col-md-6">
							<label class="form-label">Contraseña</label> <input class="form-control"
								type="password" th:field="*{contrasena}">
						</div>
						<div class="col-md-6">
							<label class="form-label">Correo</label> <input class="form-control"
								type="email" th:field="*{correo}">
						</div>
					</div>
					<div class="d-flex justify-content-end gap-2 mt-4">
						<button class="btn btn-light" type="button" onclick="history.back()">
							<i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
						</button>
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check2-circle" aria-hidden="true"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</section>
	</div>
</body>
</html>
