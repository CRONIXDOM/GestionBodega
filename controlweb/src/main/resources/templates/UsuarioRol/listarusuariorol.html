<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="utf-8">
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-person-badge" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Accesos</p>
					<h1 class="h3 mb-1">Usuario Rol</h1>
					<p class="text-muted mb-0">Asignaciones de rol a usuarios.</p>
				</div>
			</div>
			<div class="heading-actions">
				<a class="btn btn-primary btn-sm" th:href="@{/usuariorol/nuevo}"><i class="bi bi-plus-circle"
					aria-hidden="true"></i> Nuevo</a>
			</div>
		</div>


		<div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
			<i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i> <span th:text="${error}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
		</div>
		<section class="panel mt-3">
			<div class="p-3 pb-0">
				<div class="input-group table-search" style="max-width: 340px;">
					<span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
					<input type="text" class="form-control" data-table-search="tablaUsuariorol" placeholder="Buscar...">
				</div>
			</div>
			<div class="table-responsive">
				<table id="tablaUsuariorol" class="table align-middle mb-0" data-page-size="15">
					<thead>
						<tr>
							<th scope="col">Id</th>
							<th scope="col">Fecha Asignación</th>
							<th scope="col">Usuario</th>
							<th scope="col">Rol</th>
							<th scope="col" class="text-end">Acción</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="indice:${listausuariorol}">
							<td class="fw-semibold" th:text="${indice.idUsuarioRol}"></td>
							<td th:text="${indice.fechaAsignacion}"></td>
							<td th:text="${nombresUsuario.get(indice.idUsuario)} ?: ('#' + indice.idUsuario)"></td>
							<td th:text="${nombresRol.get(indice.idRol)} ?: ('#' + indice.idRol)"></td>
							<td class="text-end">
								<a class="btn btn-light btn-sm" th:href="@{/usuariorol/editar/{id}(id=${indice.idUsuarioRol})}"><i
									class="bi bi-pencil" aria-hidden="true"></i> Editar</a>
								<a class="btn btn-outline-danger btn-sm" th:href="@{/usuariorol/eliminar/{id}(id=${indice.idUsuarioRol})}"
									onclick="return confirm('¿Seguro que deseas eliminar?')"><i class="bi bi-trash"
									aria-hidden="true"></i> Eliminar</a>
							</td>
						</tr>
						<tr data-empty-row th:if="${#lists.isEmpty(listausuariorol)}">
							<td colspan="5" class="text-center text-muted py-4">Todavía no hay asignaciones registradas.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</body>
</html>
