<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="UTF-8">
<title>Usuario Rol</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-person-badge" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Accesos</p>
					<h1 class="h3 mb-1">Registro de Usuario Rol</h1>
					<p class="text-muted mb-0">Completa los datos de la asignación.</p>
				</div>
			</div>
		</div>

		<section class="row g-3 mt-1">
			<div class="col-12 col-xl-7">
				<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
				<form class="panel" th:action="@{/usuariorol/guardar}" th:object="${usuarioRol}" method="post">
					<input type="hidden" th:field="*{idUsuarioRol}">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Fecha de Asignación</label> <input class="form-control"
								type="date" th:field="*{fechaAsignacion}">
						</div>
						<div class="col-md-6">
							<label class="form-label">Id de Usuario <span class="text-danger">*</span></label> <select class="form-select"
								th:field="*{idUsuario}" required>
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesUsuario}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Id de Rol <span class="text-danger">*</span></label> <select class="form-select"
								th:field="*{idRol}" required>
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesRol}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
						</div>
					</div>
					<div class="d-flex justify-content-end gap-2 mt-4">
						<button class="btn btn-light" type="button" onclick="history.back()">
							<i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
						</button>
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check2-circle" aria-hidden="true"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</section>
	</div>
</body>
</html>
