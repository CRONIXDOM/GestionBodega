<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="utf-8">
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-truck" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Movimientos</p>
					<h1 class="h3 mb-1">Entregas</h1>
					<p class="text-muted mb-0">Entregas registradas.</p>
				</div>
			</div>
			<div class="heading-actions">
				<a class="btn btn-primary btn-sm" th:href="@{/entrega/nuevo}"><i class="bi bi-plus-circle"
					aria-hidden="true"></i> Nuevo</a>
			</div>
		</div>

		<section class="panel mt-3">
			<div class="p-3 pb-0">
				<div class="input-group table-search" style="max-width: 340px;">
					<span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
					<input type="text" class="form-control" data-table-search="tablaEntrega" placeholder="Buscar...">
				</div>
			</div>
			<div class="table-responsive">
				<table id="tablaEntrega" class="table align-middle mb-0" data-page-size="15">
					<thead>
						<tr>
							<th scope="col">Id</th>
							<th scope="col">Fecha</th>
							<th scope="col">Responsable</th>
							<th scope="col" class="text-end">Acción</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="indice:${listaentrega}">
							<td class="fw-semibold" th:text="${indice.idEntrega}"></td>
							<td th:text="${indice.fechaEntrega}"></td>
							<td th:text="${indice.responsableEntrega}"></td>
							<td class="text-end">
								<a class="btn btn-light btn-sm" th:href="@{/entrega/editar/{id}(id=${indice.idEntrega})}"><i
									class="bi bi-pencil" aria-hidden="true"></i> Editar</a>
								<a class="btn btn-outline-danger btn-sm" th:href="@{/entrega/eliminar/{id}(id=${indice.idEntrega})}"
									onclick="return confirm('¿Seguro que deseas eliminar?')"><i class="bi bi-trash"
									aria-hidden="true"></i> Eliminar</a>
							</td>
						</tr>
						<tr data-empty-row th:if="${#lists.isEmpty(listaentrega)}">
							<td colspan="4" class="text-center text-muted py-4">Todavía no hay entregas registradas.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</body>
</html>
