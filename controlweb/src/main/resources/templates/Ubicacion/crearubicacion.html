<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="UTF-8">
<title>Ubicación</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-geo-alt" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Catálogo</p>
					<h1 class="h3 mb-1">Registro de Ubicación</h1>
					<p class="text-muted mb-0">Completa los datos de la ubicación.</p>
				</div>
			</div>
		</div>

		<section class="row g-3 mt-1">
			<div class="col-12 col-xl-7">
				<form class="panel" th:action="@{/ubicacion/guardar}" th:object="${ubicacion}" method="post">
					<input type="hidden" th:field="*{idUbicacion}">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Código de Ubicación</label> <input class="form-control"
								th:field="*{codigoUbicacion}" placeholder="A-01">
						</div>
						<div class="col-md-6">
							<label class="form-label">Cantidad de Ubicación</label> <input class="form-control"
								th:field="*{cantidadUbicacion}">
						</div>
						<div class="col-md-6">
							<label class="form-label">Fecha de Ubicación</label> <input class="form-control"
								type="date" th:field="*{fechaUbicacion}">
						</div>
						<div class="col-md-6">
							<label class="form-label">Zona</label> <select class="form-select"
								th:field="*{idZona}">
								<option value="">Seleccione...</option>
								<option th:each="op : ${opcionesZona}" th:value="${op.id}" th:text="${op.etiqueta}"></option>
							</select>
						</div>
					</div>
					<div class="d-flex justify-content-end gap-2 mt-4">
						<button class="btn btn-light" type="button" onclick="history.back()">
							<i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
						</button>
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check2-circle" aria-hidden="true"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</section>
	</div>
</body>
</html>
