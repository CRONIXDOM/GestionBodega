<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="utf-8">
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-geo-alt" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Sedes y Ubicaciones</p>
					<h1 class="h3 mb-1">Ubicaciones</h1>
					<p class="text-muted mb-0">Ubicaciones registradas en la bodega.</p>
				</div>
			</div>
			<div class="heading-actions">
				<a class="btn btn-primary btn-sm" th:href="@{/ubicacion/nuevo}"><i class="bi bi-plus-circle"
					aria-hidden="true"></i> Nuevo</a>
			</div>
		</div>

		<section class="panel mt-3">
			<div class="p-3 pb-0">
				<div class="input-group table-search" style="max-width: 340px;">
					<span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
					<input type="text" class="form-control" data-table-search="tablaUbicacion" placeholder="Buscar...">
				</div>
			</div>
			<div class="table-responsive">
				<table id="tablaUbicacion" class="table align-middle mb-0" data-page-size="15">
					<thead>
						<tr>
							<th scope="col">Id</th>
							<th scope="col">Código</th>
							<th scope="col">Sede</th>
							<th scope="col">Zona</th>
							<th scope="col" style="min-width: 280px;">Productos almacenados</th>
							<th scope="col">Total</th>
							<th scope="col" class="text-end">Acción</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="indice:${listaubicacion}">
							<td class="fw-semibold" th:text="${indice.idUbicacion}"></td>
							<td th:text="${indice.codigoUbicacion}"></td>
							<td th:text="${nombresSede.get(indice.idSede)} ?: '—'"></td>
							<td th:text="${nombresZona.get(indice.idZona)} ?: '—'"></td>
							<td th:with="lineas=${contenido.get(indice.idUbicacion)}">
								<span th:if="${lineas == null or lineas.isEmpty()}" class="text-muted small">Vacía</span>
								<div th:unless="${lineas == null or lineas.isEmpty()}" class="d-flex flex-column gap-1">
									<div th:each="linea : ${lineas}" class="d-flex align-items-center gap-2">
										<span class="badge bg-secondary-subtle text-body font-monospace"
											th:text="${linea.codigoProducto} ?: '—'">COD</span>
										<span th:text="${linea.nombreProducto}">Producto</span>
										<span class="badge bg-primary-subtle text-primary"
											th:text="${linea.cantidad} + ' u.'">0 u.</span>
									</div>
								</div>
							</td>
							<td>
								<span class="fw-semibold" th:text="${unidades.getOrDefault(indice.idUbicacion, 0)}">0</span>
								<span class="text-muted small">u.</span>
							</td>
							<td class="text-end">
								<a class="btn btn-light btn-sm" th:href="@{/ubicacion/editar/{id}(id=${indice.idUbicacion})}"><i
									class="bi bi-pencil" aria-hidden="true"></i> Editar</a>
								<a class="btn btn-outline-danger btn-sm" th:href="@{/ubicacion/eliminar/{id}(id=${indice.idUbicacion})}"
									onclick="return confirm('¿Seguro que deseas eliminar?')"><i class="bi bi-trash"
									aria-hidden="true"></i> Eliminar</a>
							</td>
						</tr>
						<tr data-empty-row th:if="${#lists.isEmpty(listaubicacion)}">
							<td colspan="7" class="text-center text-muted py-4">Todavía no hay ubicaciones registradas.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</body>
</html>
