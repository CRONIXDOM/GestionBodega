<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="utf-8">
<title>Productos eliminados</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Inventario</p>
					<h1 class="h3 mb-1">Productos eliminados</h1>
					<p class="text-muted mb-0">Productos dados de baja. Su historial sigue completo y puedes devolverlos al catálogo cuando quieras.</p>
				</div>
			</div>
			<div class="heading-actions">
				<a class="btn btn-light btn-sm" th:href="@{/producto}"><i class="bi bi-arrow-left"
					aria-hidden="true"></i> Volver a productos</a>
			</div>
		</div>

		<div th:if="${exito}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
			<i class="bi bi-check2-circle" aria-hidden="true"></i> <span th:text="${exito}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
		</div>
		<div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
			<i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i> <span th:text="${error}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
		</div>

		<section class="panel mt-3">
			<div class="p-3 pb-0">
				<div class="input-group table-search" style="max-width: 340px;">
					<span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
					<input type="text" class="form-control" data-table-search="tablaEliminados" placeholder="Buscar...">
				</div>
			</div>
			<div class="table-responsive">
				<table id="tablaEliminados" class="table align-middle mb-0" data-page-size="15">
					<thead>
						<tr>
							<th scope="col">Id</th>
							<th scope="col">Nombre</th>
							<th scope="col">Código</th>
							<th scope="col">Unidades por caja</th>
							<th scope="col" class="text-end">Acción</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="indice:${listaproducto}">
							<td class="fw-semibold" th:text="${indice.idProducto}"></td>
							<td th:text="${indice.nombreProducto}"></td>
							<td th:text="${indice.codigoProducto}"></td>
							<td><span class="badge bg-secondary-subtle text-body" th:text="${indice.unidadesPorCaja} ?: '—'">—</span></td>
							<td class="text-end">
								<a class="btn btn-primary btn-sm" th:href="@{/producto/recuperar/{id}(id=${indice.idProducto})}"
									onclick="return confirm('El producto volverá al catálogo y a los selectores. ¿Continuar?')"><i
									class="bi bi-arrow-counterclockwise" aria-hidden="true"></i> Recuperar</a>
							</td>
						</tr>
						<tr data-empty-row th:if="${#lists.isEmpty(listaproducto)}">
							<td colspan="5" class="text-center text-muted py-4">No hay productos eliminados.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</body>
</html>
