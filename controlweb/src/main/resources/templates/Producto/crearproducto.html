<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/Plantilla/plantillaui">
<head>
<meta charset="UTF-8">
<title>Producto</title>
</head>
<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-box" aria-hidden="true"></i></span>
				<div>
					<p class="eyebrow mb-1">Inventario</p>
					<h1 class="h3 mb-1">Registro de Producto</h1>
					<p class="text-muted mb-0">Completa los datos del producto.</p>
				</div>
			</div>
		</div>

		<section class="row g-3 mt-1">
			<div class="col-12 col-xl-7">
				<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
				<form class="panel" th:action="@{/producto/guardar}" th:object="${producto}" method="post">
					<input type="hidden" th:field="*{idProducto}">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Nombre del Producto <span class="text-danger">*</span></label> <input class="form-control"
								th:field="*{nombreProducto}" required>
						</div>
						<div class="col-md-6">
							<label class="form-label">Código del Producto <span class="text-danger">*</span></label> <input class="form-control"
								th:field="*{codigoProducto}" required>
						</div>
						<div class="col-md-6">
							<label class="form-label">Unidades por caja <span class="text-danger">*</span></label>
							<div class="input-group">
								<input class="form-control" type="number" min="1" step="1"
									th:field="*{unidadesPorCaja}" required placeholder="Ej. 12">
								<span class="input-group-text">u. / caja</span>
							</div>
							<div class="form-text">Cuántas unidades del producto vienen en cada caja.</div>
						</div>
					</div>
					<div class="d-flex justify-content-end gap-2 mt-4">
						<button class="btn btn-light" type="button" onclick="history.back()">
							<i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
						</button>
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check2-circle" aria-hidden="true"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</section>
	</div>
</body>
</html>
