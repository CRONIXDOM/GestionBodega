spring.application.name=controlweb
server.port=8082

# La sesion se identifica SOLO por cookie. Sin esto, cuando el navegador aun no
# ha enviado la cookie de sesion (justo al iniciar sesion), Tomcat anade el id a
# la URL y redirige a "/;jsessionid=...", una ruta que Spring no sabe enrutar y
# que devuelve 404 en lugar del panel de inicio.
server.servlet.session.tracking-modes=cookie
